---
volumes:
  data:
    driver: "local"
  cloudbeaver:
    driver: "local"

services:
  redis:
    image: "redis"
    container_name: "sbs-redis"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  client:
    build: "client"
    container_name: "sbs-client"
    restart: "no"
    environment:
      LOG_LEVEL: "debug"
      SBS_SERVER: "server:8080"
    links:
      - "server"
    ports:
      - "8080:8080"
    volumes:
      - "${PWD}/client:/opt/app/client"

  server:
    build: "server"
    container_name: "sbs-server"
    restart: "no"
    # Migrate once, then start workers without re-running Alembic (avoids multi-worker races).
    command:
      - /bin/bash
      - -c
      - |
        set -euo pipefail
        envsubst <"$${CONFIG_TEMPLATE:-server/config/test_config.yml}" >"server/$${CONFIG}"
        python - <<'PY'
        import os
        import time

        from sqlalchemy import create_engine, text
        from sqlalchemy.exc import OperationalError

        from server.db.db import db_migrations

        uri = os.environ["DATABASE_URI"]
        while True:
            try:
                with create_engine(uri).connect() as conn:
                    conn.execute(text("SELECT 1"))
                break
            except OperationalError:
                print("Waiting for the database...")
                time.sleep(1)

        db_migrations(uri)
        print("Database migrations applied (alembic upgrade head)")
        PY
        export SKIP_APP_MIGRATIONS=1
        exec /usr/local/bin/gunicorn \
          --worker-class eventlet \
          --workers "$${GUNICORN_WORKERS:-8}" \
          --bind 0.0.0.0:8080 \
          --timeout 300 \
          --reload \
          server.__main__:app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    links:
      - "db"
      - "redis"
    expose:
      - "8080"
    volumes:
      - "${PWD}/etc/config.yml:/etc/config.yml"
      - "${PWD}/server:/opt/server"
    environment:
      CONFIG_TEMPLATE: "/etc/config.yml"
      TESTING: 1
      PROFILE: "local"
      ALLOW_MOCK_USER_API: 1
      GUNICORN_WORKERS: "${GUNICORN_WORKERS:-8}"
      DATABASE_URI: "mysql+mysqldb://sbs:sbs@db/sbs?charset=utf8mb4"
      REDIS_URI: "redis://redis:6379/"
      BASE_URL: "http://localhost:8080"
      SOCKET_URL: "ws://localhost:8080"
      SECRET: "${SECRET:-geheim}"
      CLIENT_ID: "${CLIENT_ID:-foo}"
      CLIENT_SECRET: "${CLIENT_SECRET:-echtgeheim}"
      AUDIENCE: "${AUDIENCE:-http://localhost:9001}"
      ADMIN: "${ADMIN:-urn:john}"
      LDAP_URL: "${LDAP_URL:-ldap://localhost:1389/dc=example,dc=org}"
      LDAP_BIND: "${LDAP_BIND:-cn=admin,dc=example,dc=org}"

  db:
    image: "docker.io/mariadb:11"
    container_name: "sbs-db"
    restart: "no"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 60s
    environment:
      MARIADB_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-sbs}"
      MARIADB_DATABASE: "sbs"
      MARIADB_USER: "sbs"
      MARIADB_PASSWORD: "sbs"
    ports:
      - "13306:3306"
    volumes:
      - "data:/var/lib/mysql:Z"
      - "${PWD}/etc/init.sql:/docker-entrypoint-initdb.d/init.sql:ro"
